[package]
name = "madar-web"
description = "The madar-shared rules for the browser (WebAssembly): thin wasm-bindgen bindings, no rule of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Built by scripts/build-wasm.sh into dist/full and dist/public. Natively it is
# an rlib that the workspace's fmt, clippy and test runs check like any crate.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The customer pages (ordering, menu, loyalty, bookings): what they compute.
public = [
    "dep:madar-catalog",
    "dep:madar-money",
    "madar-money/tsify",
    "dep:madar-loyalty",
    "dep:madar-plan",
    "madar-plan/tsify",
    "dep:madar-ids",
    "dep:rust_decimal",
    "dep:madar-time",
    "dep:chrono",
    "dep:chrono-tz",
]
# The web dashboard: every rule it computes. A superset of `public`.
full = [
    "public",
    "dep:madar-dawam",
    "dep:madar-units",
    "dep:madar-inventory",
    "dep:madar-till",
]
# The self-serve menu import (madar-menu with its Foodics reader), a package of
# its own: the dashboard loads it when the import dialog opens, so neither boot
# package carries the reader.
menu = ["dep:madar-menu"]
# The Rewards card designer and its rules (madar-card: designs, tracks,
# audiences, messages), a package of its own: the dashboard loads it when a
# Rewards page that needs it opens, so neither boot package carries it.
card = ["dep:madar-card"]

[dependencies]
# Exactly the wasm-bindgen CLI's version: the glue it writes must match.
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", default-features = false, features = ["js"] }

madar-catalog = { path = "../madar-catalog", features = ["tsify"], optional = true }
madar-money = { path = "../madar-money", optional = true }
madar-ids = { path = "../madar-ids", optional = true }
madar-loyalty = { path = "../madar-loyalty", optional = true }
madar-plan = { path = "../madar-plan", optional = true }
madar-time = { path = "../madar-time", optional = true }
madar-dawam = { path = "../madar-dawam", optional = true }
madar-units = { path = "../madar-units", optional = true }
madar-inventory = { path = "../madar-inventory", features = ["tsify"], optional = true }
madar-till = { path = "../madar-till", optional = true }
# The menu import, in the `menu` package only (node/vectors.test.mjs checks
# `public` and `full` export none of it).
madar-menu = { path = "../madar-menu", features = ["foodics", "tsify"], optional = true }
# The card designer, in the `card` package only.
madar-card = { path = "../madar-card", features = ["tsify"], optional = true }

rust_decimal = { version = "1", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
# `filter-by-regex`: the `public` build keeps only the zones in
# scripts/tz-filter.txt (CHRONO_TZ_TIMEZONE_FILTER); `full` sets no filter and
# keeps every zone.
chrono-tz = { version = "0.10", features = ["filter-by-regex"], optional = true }
