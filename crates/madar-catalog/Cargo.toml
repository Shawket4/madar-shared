# madar-catalog: how a sale line is priced from the catalogue — the size
# price, the options (swap or add-on) and the optional fields. The backend's
# rule (`orders/component_resolve.rs`, `catalog_unit_price`), which the POS
# core now runs over its menu mirror instead of its own swap families.
[package]
name = "madar-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The feed readers (`feed`) take the wire rows as JSON values.
serde_json = "1"
