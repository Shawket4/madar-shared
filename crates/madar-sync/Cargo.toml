# madar-sync: the /sync/pull contract pieces the backend and the POS core share.
[package]
name = "madar-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# sha2 0.10: already in both consumers' trees (the core also carries 0.11).
sha2 = "0.10"
uuid = { version = "1", default-features = false, features = ["v5"] }

[dev-dependencies]
serde_json = "1"
