# madar-sync: the /sync/pull contract pieces the backend and the POS core share.
[package]
name = "madar-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# sha2 0.10: already in both consumers' trees (the core also carries 0.11).
sha2 = "0.10"
# `serde` for the replay envelopes' ids (both consumers build uuid with it).
uuid = { version = "1", default-features = false, features = ["v5", "serde"] }
# The replay envelopes (`replay`): their `request` bodies stay JSON here; each
# side types them against its own request structs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
