# madar-menu: a whole menu as one value (`bulk`), the checks a server runs
# before writing it, and (feature `foodics`) the reader that builds one from a
# Foodics console export. The backend uses `bulk` only; the dashboards also
# turn on `foodics` (the web one through madar-web, Flutter through the core).
[package]
name = "madar-menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The Foodics reader only: never compiled into the backend.
csv = { version = "1.3", optional = true }
tsify = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }
# The backend's OpenAPI schemas for the request and the answer.
utoipa = { version = "5", optional = true, default-features = false, features = ["macros"] }

[dev-dependencies]
serde_json = "1"

[features]
foodics = ["dep:csv"]
tsify = ["dep:tsify", "dep:wasm-bindgen"]
utoipa = ["dep:utoipa"]

# The tsify derive expands to `wasm_bindgen` paths, so the feature needs the
# crate though no source line names it.
[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[package.metadata.cargo-shear]
ignored = ["wasm-bindgen"]
