# madar-till: a till's drawer, Z report, carryover and close reconciliation,
# as pure folds over rows the callers load (the server from Postgres, the POS
# core from its SQLite ledger).
[package]
name = "madar-till"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# No `clock`: nothing here reads the time. Instants arrive as RFC 3339.
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# The refund tax/service split is madar-money's (one copy, same tag).
madar-money = { path = "../madar-money", version = "0.4.0" }

[dev-dependencies]
serde_json = "1"
