# madar-money: the money rules the backend and the POS core both run.
#
# v1 holds ONLY code that was already identical on both sides and pinned by
# vectors: moving it here changes no result. The vectors in vectors/ are this
# crate's tests, and consumers read the same bytes through `vectors`.
[package]
name = "madar-money"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Default features off: the POS core builds rust_decimal without `std`, and a
# shared crate must not switch features on in either consumer.
rust_decimal = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# The business date is madar-time's (one copy, same tag).
madar-time = { path = "../madar-time", version = "0.3.0" }
# The discount act is judged by madar-authz (one copy, same tag).
madar-authz = { path = "../madar-authz", version = "0.3.0" }

[dev-dependencies]
rust_decimal_macros = "1"
serde_json = "1"
