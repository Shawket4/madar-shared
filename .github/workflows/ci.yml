name: CI

# The shared crates' own gate. Every consumer (MadarRust, madar/rust-core)
# pins a TAG of this repo, so a tag is only as good as the commit it points at:
# nothing is tagged that this workflow has not passed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests + generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --workspace --locked

      # Optional features a consumer switches on (the backend's OpenAPI
      # schemas): linted and tested too.
      - name: tests (all features)
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          # madar-web's public build alone (the line above lints it with full).
          cargo clippy -p madar-web --all-targets --features public --locked -- -D warnings

      # The permission registry (crates/madar-authz/src/generated.rs) is
      # generated from authz/spec/capabilities.toml. Fail when it is stale.
      # The dashboard's capabilities.ts and the POS's capabilities.dart are
      # checked by passing --dashboard/--pos next to sibling checkouts; CI has
      # neither, so it checks this repo's own output.
      - name: permission registry is generated and current
        run: cargo run --locked -p authz-gen -- --check

  msrv:
    # The oldest toolchain a consumer builds these crates with: the backend's
    # Docker image (rust:1.88). A newer language feature here breaks a deploy.
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: build
        run: cargo build --workspace --all-features --locked

  wasm:
    # The browser packages (crates/madar-web): built with the pinned recipe and
    # proven by the same vector files the crates pass, through the wasm.
    name: wasm packages + vectors through them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pin lives in scripts/build-wasm.sh (PINNED, checked by commit).
      - name: pinned nightly
        run: |
          tc=$(sed -n 's/^PINNED=\([^ ]*\).*/\1/p' scripts/build-wasm.sh)
          rustup toolchain install "$tc" --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: binaryen (wasm-opt) 133
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: build
        run: scripts/build-wasm.sh
      - name: vectors through the wasm
        run: node --test node/vectors.test.mjs
      - name: the .d.ts files typecheck
        run: npx --yes -p typescript@6.0.3 tsc --noEmit --strict --target es2022 --module es2022 --lib es2022,dom dist/public/madar_web.d.ts dist/full/madar_web.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: madar-web-dist
          path: dist/

  release-wasm:
    # On a tag: the same build, attached to the tag's GitHub release. Consumers
    # pin the tag and a tarball's sha256 (README "The browser packages").
    name: attach the wasm packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, msrv, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: madar-web-dist
          path: dist
      - name: package and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in public full; do
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C dist -cf - "$pkg" | gzip -n >"madar-web-$pkg.tar.gz"
          done
          { cat dist/SHA256SUMS; sha256sum madar-web-public.tar.gz madar-web-full.tar.gz; } >SHA256SUMS
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "See CHANGELOG.md."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber madar-web-public.tar.gz madar-web-full.tar.gz SHA256SUMS
